# Leads service database (owned only by the Leads service).
# Data lives on a PersistentVolumeClaim, so it survives pod / StatefulSet deletion.
# Credentials come from the "postgres-leads-credentials" Secret (created separately, not committed):
#   kubectl create secret generic postgres-leads-credentials \
#     --from-literal=POSTGRES_USER=leads_svc \
#     --from-literal=POSTGRES_PASSWORD=<password> \
#     --from-literal=POSTGRES_DB=leads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-leads-data
  labels:
    app: postgres-leads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-leads
  labels:
    app: postgres-leads
spec:
  type: NodePort
  selector:
    app: postgres-leads
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30434
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-leads
  labels:
    app: postgres-leads
spec:
  serviceName: postgres-leads
  replicas: 1
  selector:
    matchLabels:
      app: postgres-leads
  template:
    metadata:
      labels:
        app: postgres-leads
    spec:
      containers:
        - name: postgres
          image: postgres:17
          # Small footprint for a dev machine.
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=50"]
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-leads-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-leads-data
